name: Publicar release Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"
      - name: Validar o atualizador
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q app_version.py updater.py ui main.py
          python -m pytest tests/test_updater.py tests/test_webview_runtime.py tests/test_release_packaging.py -q
      - name: Gerar instalador
        shell: powershell
        run: |
          choco install innosetup --no-progress -y
          $version = ""
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+(\.\d+){0,3})$') {
              throw "Tag de versão inválida: $env:GITHUB_REF_NAME"
            }
            $version = $Matches[1]
          }
          .\scripts\build_windows_release.ps1 -PythonExe python -AppVersion $version
      - name: Publicar no GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Accessible-Reels-Setup.exe
            dist/Accessible-Reels-Setup.exe.sha256
